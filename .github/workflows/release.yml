name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and flake
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3221225472
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      # Release-specific gates only. Product SemVer/manifest alignment run in
      # nix flake check. Version is read via Nix (no host jq).
      - name: Match tag to plugin.json and require main ancestry
        id: meta
        run: |
          set -euo pipefail
          version="$(nix eval --impure --raw --expr '(builtins.fromJSON (builtins.readFile ./plugin.json)).version')"
          if [[ -z "$version" ]]; then
            echo "plugin.json missing .version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' must equal v${version} from plugin.json" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi

          # SemVer: prerelease is before '+'; build metadata may contain '-'.
          core="${version%%+*}"
          prerelease=false
          if [[ "$core" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=deployah-agent-skills-v${version}.zip" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      # Builds checks.validate and checks.release (packs and verifies the artifact).
      - name: Validate
        run: nix flake check --print-build-logs

  package:
    name: Build release artifact
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3221225472
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build artifact
        run: nix build .#release --print-build-logs

      - name: Stage artifact
        env:
          ZIP_NAME: ${{ needs.validate.outputs.zip_name }}
        run: |
          set -euo pipefail
          test -f "result/${ZIP_NAME}"
          # Deep verification already ran in checks.release via flake check.
          mkdir -p dist
          cp "result/${ZIP_NAME}" "dist/${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-zip
          path: dist

      # Runner gh for GitHub API only. Product/packaging tools come from Nix above.
      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          headers="$(mktemp)"
          gh api --method GET \
            "repos/${GITHUB_REPOSITORY}/releases/tags/${GITHUB_REF_NAME}" \
            --cache 0 \
            -i 1>"$headers" 2>/dev/null
          api_exit=$?
          set -e
          http_code="$(tr -d '\r' < "$headers" | awk 'toupper($1) ~ /^HTTP\// { print $2; exit }')"
          rm -f "$headers"

          case "$http_code" in
            200)
              echo "Release ${GITHUB_REF_NAME} already exists; skipping (no overwrite)"
              echo "skip=true" >> "$GITHUB_OUTPUT"
              ;;
            404)
              echo "skip=false" >> "$GITHUB_OUTPUT"
              ;;
            *)
              echo "GitHub API error querying release ${GITHUB_REF_NAME}: HTTP ${http_code:-unknown} (exit ${api_exit})" >&2
              exit 1
              ;;
          esac

      - name: Create draft GitHub Release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Deployah Agent Skills v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ needs.validate.outputs.zip_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
