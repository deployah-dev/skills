name: Release

on:
  push:
    tags:
      - "v*"

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  validate:
    name: Validate tag and flake
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.meta.outputs.version }}
      zip_name: ${{ steps.meta.outputs.zip_name }}
      prerelease: ${{ steps.meta.outputs.prerelease }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      # Release-specific gates only. Product SemVer and manifest alignment run
      # inside nix flake check (check-product-version.sh).
      - name: Match tag to plugin.json and require main ancestry
        id: meta
        run: |
          set -euo pipefail
          version="$(jq -r '.version // empty' plugin.json)"
          if [[ -z "$version" ]]; then
            echo "plugin.json missing .version" >&2
            exit 1
          fi
          if [[ "${GITHUB_REF_NAME}" != "v${version}" ]]; then
            echo "Tag '${GITHUB_REF_NAME}' must equal v${version} from plugin.json" >&2
            exit 1
          fi

          git fetch --no-tags origin main
          if ! git merge-base --is-ancestor "$GITHUB_SHA" origin/main; then
            echo "Tag commit $GITHUB_SHA is not reachable from origin/main" >&2
            exit 1
          fi

          prerelease=false
          if [[ "$version" == *-* ]]; then
            prerelease=true
          fi

          echo "version=$version" >> "$GITHUB_OUTPUT"
          echo "zip_name=deployah-agent-skills-v${version}.zip" >> "$GITHUB_OUTPUT"
          echo "prerelease=$prerelease" >> "$GITHUB_OUTPUT"

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3221225472
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      # Builds checks.validate and checks.release (packs and verifies the artifact).
      - name: Validate
        run: nix flake check --print-build-logs

  package:
    name: Build release artifact
    needs: validate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: cachix/install-nix-action@75c75c31ebece974e48ebc36b4ad125bd97bd97b # v31.11.3
        with:
          github_access_token: ${{ secrets.GITHUB_TOKEN }}

      - uses: nix-community/cache-nix-action@7df957e333c1e5da7721f60227dbba6d06080569 # v7.0.2
        with:
          primary-key: nix-${{ runner.os }}-${{ hashFiles('flake.nix', 'flake.lock', 'nix/**') }}
          restore-prefixes-first-match: nix-${{ runner.os }}-
          gc-max-store-size-linux: 3221225472
          purge: true
          purge-prefixes: nix-${{ runner.os }}-
          purge-created: 0
          purge-last-accessed: P7D
          purge-primary-key: never

      - name: Build artifact
        run: nix build .#release --print-build-logs

      - name: Stage artifact
        env:
          ZIP_NAME: ${{ needs.validate.outputs.zip_name }}
        run: |
          set -euo pipefail
          test -f "result/${ZIP_NAME}"
          # Deep verification already ran in checks.release via flake check.
          mkdir -p dist
          cp "result/${ZIP_NAME}" "dist/${ZIP_NAME}"

      - name: Upload artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-zip
          path: dist/*
          if-no-files-found: error

  publish:
    name: Create draft GitHub Release
    needs: [validate, package]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download artifact
        uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          name: release-zip
          path: dist

      - name: Check for existing release
        id: existing
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          set +e
          err="$(mktemp)"
          gh release view "${GITHUB_REF_NAME}" > /dev/null 2>"$err"
          code=$?
          set -e
          if [[ $code -eq 0 ]]; then
            echo "Release ${GITHUB_REF_NAME} already exists; skipping (no overwrite)"
            echo "skip=true" >> "$GITHUB_OUTPUT"
            rm -f "$err"
            exit 0
          fi
          # gh prints "release not found" (or HTTP 404) when the tag has no release.
          if grep -Eiq 'release not found|HTTP 404|Not Found' "$err"; then
            echo "skip=false" >> "$GITHUB_OUTPUT"
            rm -f "$err"
            exit 0
          fi
          echo "Failed to query GitHub Release ${GITHUB_REF_NAME}:" >&2
          cat "$err" >&2 || true
          rm -f "$err"
          exit 1

      - name: Create draft GitHub Release
        if: steps.existing.outputs.skip != 'true'
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ github.ref_name }}
          name: Deployah Agent Skills v${{ needs.validate.outputs.version }}
          draft: true
          prerelease: ${{ needs.validate.outputs.prerelease == 'true' }}
          generate_release_notes: true
          files: dist/${{ needs.validate.outputs.zip_name }}
          fail_on_unmatched_files: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
